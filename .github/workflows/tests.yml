name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Repository layout check
        # Root holds only entry-point launchers; tests in tests/, modules in the
        # package. See .claude/skills/repo-layout/SKILL.md.
        run: python scripts/layout_check.py

      - run: python -m pytest tests/ -q
